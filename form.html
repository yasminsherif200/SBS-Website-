<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="form.css">
        <link rel="icon" href="sbs_ic.png">
        <title>Registration Form</title>
    </head>
    <body>
        <main>
            <header class="glow-title">
                Welcome to SBS Family❤️.
            </header>
            <form target="_blank" id="teamForm" method="post">
                <div class="info1">
                    <label for="firstname">Name</label> <br>
                    <input type="text" id="firstname" name="firstname"> 
                </div>

                <div class="info2">
                    <label for="community">Community</label>
                    <select id="community">
                        <option value="">Select Community</option>
                        <option>HR</option>
                        <option>PR</option>
                        <option>FR</option>
                        <option>Marketing</option>
                        <option>Creative</option>
                        <option>Content Writing</option>
                        <option>Graphic Design</option>
                        <option>Media</option>
                        <option>Community Moderator</option>
                        <option>Software Engineer</option>
                    </select>
                </div>

                <div class="info3">
                    <label for="image">Image Link </label>
                    <input type="file" id="image" name="image">
                </div>

                <div class="info4">
                    <label for="facebook">Facebook URL</label>
                    <input type="text" id="facebook" name="facebook_url">

                    <label for="instagram">Instagram URL</label>
                    <input type="text" id="instagram" name="instagram_url">

                    <label for="linkedin">LinkedIn URL</label>
                    <input type="text" id="linkedin" name="linkedin_url">

                    <label for="whatsapp">WhatsApp URL</label>
                    <input type="text" id="whatsapp" name="whatsapp_url">

                    <label for="github">GitHub URL</label>
                    <input type="text" id="github" name="github_url">
                </div>

                <button type="submit">Submit</button>
            </form>

            <div id="thankYouCard" style="display: none;">
                    <h2>Thank you for joining the SBS Family 💜✨</h2>
                    <p>Your information has been received successfully.</p>
                </div>
        </main>

        <script src="form.js"></script>        

    </body>
</html>
